# Targets for examples/validate.py: the servers a casebook runs on, named in one place.
# Pass the path to load_targets(); every [targets.<name>] table becomes one Target.

[targets.gpu-a]
model = "Qwen/Qwen3-32B"             # the served model name
base_url = "http://localhost:8000/v1"  # an OpenAI-compatible endpoint, for example vLLM
# api_key_env = "VLLM_API_KEY"       # name of the environment variable that holds the key
# concurrency = 32                   # what a benchmark recommended; examples/validate.py prints it
info = { gpu = "1x RTX 4090", host = "gpu-a" }  # free-form, stored verbatim with every run

# A second target with the same model checks reproducibility; one with another model
# gives a model comparison.
# [targets.gpu-b]
# model = "Qwen/Qwen3-32B"
# base_url = "http://gpu-b:8000/v1"
